name: amorif-backend-issue5-homolog
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: amorif_homolog
      POSTGRES_PASSWORD: local-homolog-only
      POSTGRES_DB: amorif_homolog
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U amorif_homolog -d amorif_homolog"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - dados:/var/lib/postgresql/data
  backend:
    build:
      context: ../..
      dockerfile: ops/homologacao/Dockerfile.backend
    environment:
      SPRING_PROFILES_ACTIVE: dev,homologacao
      AMORIF_AUTOMATICAS_CRON: "0 * * * * *"
      AMORIF_AUTOMATICAS_ENABLED: "true"
      DB_URL_DEV: jdbc:postgresql://postgres:5432/amorif_homolog
      DB_USER: amorif_homolog
      DB_PASSWORD: local-homolog-only
      JWT_SECRET_KEY: local-only-backend-issue5-homolog-secret
      JWT_EXPIRE_LENGTH: 86400000
      ALLOWED_CORS: http://localhost:3105
      ALLOWED_CORS_PROD: http://localhost:3105
      SUAP_USER_INFO_URL: http://gateway:8080/suap/user
      SUAP_TOKEN_URL: http://gateway:8080/suap/token
      SUAP_CLIENT_ID: homologacao-local
      SUAP_CLIENT_SECRET: homologacao-local
      SUAP_REDIRECT_URI: http://localhost:3105
      SPRING_JPA_SHOW_SQL: 'false'
      LOGGING_LEVEL_ROOT: INFO
      LOGGING_LEVEL_ORG_HIBERNATE: WARN
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_BOOT: INFO
      LOGGING_LEVEL_ORG_POSTGRESQL: WARN
    depends_on:
      postgres:
        condition: service_healthy
  frontend:
    build:
      context: ../../../com-amor-if-frontend
      dockerfile: ../com-amor-if-backend/ops/homologacao/Dockerfile.frontend
    environment:
      NEXT_PUBLIC_REACT_APP_API_URL: /api/
  gateway:
    image: node:22.12.0-alpine
    command: [node, /gateway.cjs]
    volumes:
      - ./gateway.cjs:/gateway.cjs:ro
    ports:
      - 127.0.0.1:3105:8080
    depends_on:
      - backend
      - frontend
volumes:
  dados:
