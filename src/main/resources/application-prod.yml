spring:
  datasource:
    url: ${DB_URL_PROD}
    password: ${DB_PASSWORD_PROD}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration

logging:
  level:
    "[org.springframework.data.web]": DEBUG
    "[org.hibernate]": DEBUG
    "[org.postgresql]": DEBUG
