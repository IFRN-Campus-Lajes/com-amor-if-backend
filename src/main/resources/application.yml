security:
  jwt:
    token:
      secret-key: ${JWT_SECRET_KEY}
      expire-lenght: 3600000

spring:
  config:
    import: optional:file:.env[.properties]

  datasource:
    driver-class-name: org.postgresql.Driver
    username: ${DB_USER}

  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect