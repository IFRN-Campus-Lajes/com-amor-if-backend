ALLOWED_CORS: http://localhost:3000
ALLOWED_CORS_PROD: http://localhost:3000

security:
  jwt:
    token:
      secret-key: test-secret
      expire-lenght: 3600000

spring:
  datasource:
    url: jdbc:h2:mem:amorif;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
